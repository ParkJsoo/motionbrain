name: PlatformIO

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for browser recovery tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio opencv-python-headless numpy Pillow

      - name: Run Python vision tests
        run: python -m unittest discover -s tests

      - name: Build ESP32 controller
        run: pio run

      - name: Build opt-in M4 device goal guard
        run: pio run -e esp32dev_m4_goal_guard

      - name: Build opt-in whole-arm policy controller
        run: pio run -e esp32dev_whole_arm_policy

      - name: Build ESP32-CAM firmware
        run: pio run -d firmware/esp32cam

      - name: Build finite ESP32-CAM register diagnostic
        run: pio run -d firmware/esp32cam -e esp32cam_register_diag
