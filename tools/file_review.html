<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두 카메라 판독</title>
<style>body{font:17px system-ui;background:#f5f6f8;color:#17212b;margin:0;padding:24px;max-width:1300px;margin:auto}h1{font-size:27px;margin:0 0 8px}p{line-height:1.5}.status{padding:14px;background:white;border-radius:10px;margin:18px 0;font-weight:600}.images{display:grid;grid-template-columns:2fr 1fr;gap:16px}figure{margin:0;background:#171b20;border-radius:10px;overflow:hidden}img{width:100%;height:330px;object-fit:contain}figcaption{color:white;padding:12px}fieldset{border:1px solid #ccd2da;border-radius:10px;background:white;margin:20px 0;padding:18px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:flex;align-items:center;justify-content:space-between;gap:12px}select,button{font:inherit;padding:10px;border:1px solid #a5afba;border-radius:7px}button{cursor:pointer;background:#075fba;color:white;margin-right:8px}button.secondary{background:white;color:#17212b}button:disabled{opacity:.4;cursor:default}.note{font-size:15px;color:#54616f}input{width:20px;height:20px}@media(max-width:800px){.images,.fields{grid-template-columns:1fr}img{height:240px}}</style>
<h1 id="title">두 카메라 판독</h1><p id="mode"></p><p>현재 두 영상을 확인한 뒤 직접 판정하세요. 이동 여유·턱 접촉·테이블 지지는 현장의 사람이 확인해야 합니다.</p>
<p id="action"><strong>검토할 동작을 기다리는 중입니다.</strong></p>
<div id="status" class="status">새 영상을 기다리는 중입니다.</div>
<div class="images"><figure><img id="external" alt="현재 외부 카메라 원본"><figcaption>외부 카메라</figcaption></figure><figure><img id="gripper" alt="현재 집게 카메라 원본"><figcaption>집게 카메라</figcaption></figure></div>
<fieldset><legend>이번 영상에 대한 확인</legend><div class="fields">
<label>영상이 안정적인가요?<select id="stable"><option value="">선택 안 함</option><option value="true">예</option><option value="false">아니요</option></select></label>
<label>현장 작업자가 있나요?<select id="operatorPresent"><option value="">선택 안 함</option><option value="true">예</option><option value="false">아니요</option></select></label>
<label>움직일 여유를 현장에서 확인했나요?<select id="clearanceVerified"><option value="">선택 안 함</option><option value="true">예</option><option value="false">아니요</option></select></label>
<label>양턱의 물체 접촉을 현장에서 확인했나요?<select id="jawContactVerified"><option value="">선택 안 함</option><option value="true">예</option><option value="false">아니요</option></select></label>
<label>물체의 테이블 지지를 현장에서 확인했나요?<select id="tableSupportVerified"><option value="">선택 안 함</option><option value="true">예</option><option value="false">아니요</option></select></label>
</div><p><label style="justify-content:flex-start"><input type="checkbox" id="seen">이번에 표시된 두 원본 영상을 직접 확인했습니다.</label></p>
<button id="submit" disabled>명시한 판정 제출</button><button id="unknown" class="secondary" disabled>판정 불가로 제출</button>
<p class="note">판정 불가는 모든 현장 확인을 미확인으로 남깁니다. 시간이 지나면 제출할 수 없습니다. 이 화면은 모터를 조작하거나 집기 성공을 판정하지 않습니다.</p></fieldset>
<p id="result" role="status"></p>
<script>
const ids=['stable','operatorPresent','clearanceVerified','jawContactVerified','tableSupportVerified'];let token='',current=null,loaded=new Set(),busy=false;
const $=id=>document.getElementById(id);function enable(){const ready=current?.status==='ready'&&loaded.size===2&&$('seen').checked&&!busy;$('unknown').disabled=!ready;$('submit').disabled=!(ready&&!current.readOnlyReview&&ids.every(id=>$(id).value!==''));}
ids.forEach(id=>$(id).onchange=enable);$('seen').onchange=enable;
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});const s=await r.json();if(!r.ok){current=null;$('status').textContent=s.error;enable();return;}
if(s.requestSha256!==current?.requestSha256){loaded=new Set();$('seen').checked=false;ids.forEach(id=>$(id).value='');$('result').textContent='';for(const name of ['external','gripper']){const img=$(name);img.onload=()=>{loaded.add(name);enable();};img.onerror=()=>{loaded.delete(name);enable();};if(s.previews)img.src=s.previews[name];else img.removeAttribute('src');}}
current=s;$('title').textContent=s.readOnlyReview?'읽기 전용 판독 시험':'두 카메라 판독';$('mode').textContent=s.readOnlyReview?'모터 명령은 없습니다. 현장 상태를 승인하지 않고, 실제 두 영상을 확인한 뒤 판정 불가만 제출합니다.':'';ids.forEach(id=>$(id).disabled=!!s.readOnlyReview);if(s.action){const a=s.action;$('action').textContent=`${s.readOnlyReview?'참조 메타데이터 (실행 예정 아님)':'검토 대상'}: ${a.joint==='shoulder'?'어깨 관절 (M4)':a.joint} · ${a.direction==='up'?'위쪽':a.direction} · 출력 ${a.percent}% · ${a.durationMs} ms / 물체: ${s.scene.object==='none'?'없음':s.scene.object} / 자세: ${s.scene.poseRegime}`;} $('status').textContent=s.status==='ready'?`${s.label==='before'?'동작 전':'동작 후'} 원본 · 남은 시간 ${s.remainingSeconds.toFixed(1)}초`:s.status==='expired'?'제한시간이 지났습니다. 제출하지 않습니다.':s.status==='submitted'?'이번 판정을 제출했습니다.':'새 영상을 기다리는 중입니다.';enable();}catch{current=null;enable();$('status').textContent='판독 화면 연결을 확인하세요.';}}
async function send(unknown){if(busy||!current||current.status!=='ready')return;busy=true;enable();const onsite=Object.fromEntries(ids.slice(1).map(id=>[id,unknown?false:$(id).value==='true']));try{const r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-Collection-Token':token},body:JSON.stringify({requestSha256:current.requestSha256,framesReviewed:$('seen').checked,stable:unknown?false:$('stable').value==='true',onsite,outcome:unknown?'unknown':'reviewed'})});const s=await r.json();$('result').textContent=r.ok?(unknown?'판정 불가를 제출했습니다.':'명시한 판정을 제출했습니다.'):s.error;}catch{$('result').textContent='응답을 확인하지 못했습니다. 자동 재전송하지 않습니다.';}finally{busy=false;await poll();}}
$('submit').onclick=()=>send(false);$('unknown').onclick=()=>send(true);fetch('/api/config').then(r=>r.json()).then(v=>{token=v.token;poll();setInterval(poll,250);});
</script></html>
