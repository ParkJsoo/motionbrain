; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino 2.x LEDC API 호환성을 유지하는 검증된 플랫폼 버전.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Keep local upload/monitor ports out of git.
; Example: pio run -t upload --upload-port /dev/cu.usbserial-1110

board_build.embed_txtfiles = web/device_recovery.js

; Explicit build only. Upload and physical commissioning require a separate scope.
[env:esp32dev_m2_visual_pilot]
extends = env:esp32dev
build_flags =
    -DMOTIONBRAIN_ENABLE_BOUNDED_ACTIONS=1
    -DMOTIONBRAIN_M2_VISUAL_PILOT=1

; Explicit single-profile commissioning build; never runs automatically on boot.
[env:esp32dev_m2_finite_trial]
extends = env:esp32dev
build_flags =
    -DMOTIONBRAIN_ENABLE_FINITE_PROFILE_CORE=1
    -DMOTIONBRAIN_ENABLE_FINITE_PROFILE_DRIVER=1
    -DMOTIONBRAIN_ENABLE_FINITE_PROFILE_SCHEDULER=1
    -DMOTIONBRAIN_ENABLE_FINITE_PROFILE_RUNTIME=1

; 오프라인 빌드 전용. 업로드와 실물 검증은 별도 범위다.
[env:esp32dev_m4_goal_guard]
extends = env:esp32dev
build_flags =
    -DMOTIONBRAIN_ENABLE_M4_GOAL_GUARD=1

; 오프라인 후보 빌드 전용. 기본 35%/250ms 보정은 유지한다.
; 상대 75%/500ms 보정은 출력 에너지가 증가하며 실물 검증은 아직 없다.
; 업로드·구동은 별도 범위다.
[env:esp32dev_m4_bounded_down_correction]
extends = env:esp32dev_m4_goal_guard
build_flags =
    ${env:esp32dev_m4_goal_guard.build_flags}
    -DMOTIONBRAIN_ENABLE_BOUNDED_SHOULDER_DOWN_CORRECTION=1

; 전체 팔 시연 전용 70 PWM, 명시적으로 빌드하는 모델 동작 경로.
[env:esp32dev_whole_arm_policy]
extends = env:esp32dev_m4_bounded_down_correction
build_flags =
    ${env:esp32dev_m4_bounded_down_correction.build_flags}
    -DMOTIONBRAIN_ENABLE_WHOLE_ARM_POLICY=1

; 독립 타이머를 사용하는 M3 하강 단발 실험용 빌드
[env:esp32dev_whole_arm_elbow_once]
extends = env:esp32dev_whole_arm_policy
build_flags =
    ${env:esp32dev_whole_arm_policy.build_flags}
    -DMOTIONBRAIN_ENABLE_ELBOW_DOWN_ONCE=1

; 두 카메라 관측 사이에 출력 0을 검증하는 이산 접근 전용 빌드
[env:esp32dev_whole_arm_bounded_approach]
extends = env:esp32dev_whole_arm_elbow_once
build_flags =
    ${env:esp32dev_whole_arm_elbow_once.build_flags}
    -DMOTIONBRAIN_ENABLE_BOUNDED_APPROACH=1

; 높은 시작 자세의 손목 보정 및 관측에 연결된 파지 실험
[env:esp32dev_whole_arm_pose_grasp]
extends = env:esp32dev_whole_arm_bounded_approach
build_flags =
    ${env:esp32dev_whole_arm_bounded_approach.build_flags}
    -DMOTIONBRAIN_ENABLE_POSE_GRASP=1

; 성공 시연의 M3 실제 출력 간격을 사용하는 자세 보정 실험
[env:esp32dev_whole_arm_pose_elbow_wave]
extends = env:esp32dev_whole_arm_pose_grasp
build_flags =
    ${env:esp32dev_whole_arm_pose_grasp.build_flags}
    -DMOTIONBRAIN_ENABLE_ELBOW_WAVE=1
