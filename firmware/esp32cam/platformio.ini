; MotionBrain ESP32-CAM vision node
;
; Upload separately from the main ESP32 motion controller:
;   pio run -d firmware/esp32cam
;   pio run -d firmware/esp32cam -t upload

[platformio]
default_envs = esp32cam

[env:esp32cam]
; 컨트롤러와 동일한 검증 플랫폼으로 카메라 빌드를 재현한다.
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Set upload_port and monitor_port in platformio.local.ini if auto-detect fails
; on a specific development machine.

; Finite register diagnostic; no image or camera control endpoints.
[env:esp32cam_register_diag]
extends = env:esp32cam
build_flags = -DMOTIONBRAIN_REGISTER_DIAGNOSTIC=1
